name: retailflow-orders

x-app: &app
  build:
    context: .
  environment: &app-environment
    APP_ENV: ${APP_ENV:-local}
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_ORDER_EVENTS_TOPIC: retailflow.order-events.v1
    INVENTORY_BASE_URL: http://inventory-stub:8090
    INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:?set INVENTORY_SERVICE_TOKEN in .env}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@retailflow.local}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailflow_orders}
      POSTGRES_USER: ${POSTGRES_USER:-retailflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-retailflow} -d ${POSTGRES_DB:-retailflow_orders}"
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.8.0-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 20

  inventory-stub:
    <<: *app
    command:
      - uvicorn
      - dev_support.inventory_stub:app
      - --host
      - 0.0.0.0
      - --port
      - "8090"
    environment:
      INVENTORY_SERVICE_TOKEN: ${INVENTORY_SERVICE_TOKEN:?set INVENTORY_SERVICE_TOKEN in .env}
    ports:
      - "8090:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8090/health/live', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-stub:
        condition: service_healthy

  worker:
    <<: *app
    command:
      - celery
      - --app
      - retailflow_orders.worker:celery_app
      - worker
      - --loglevel
      - INFO
    depends_on:
      api:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  beat:
    <<: *app
    command:
      - celery
      - --app
      - retailflow_orders.worker:celery_app
      - beat
      - --loglevel
      - INFO
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  postgres-data:
