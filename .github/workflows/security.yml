name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1

    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install verified Gitleaks binary
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "${base_url}/${archive}" --output "${archive}"
          curl --fail --silent --show-error --location \
            "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output checksums.txt
          grep " ${archive}$" checksums.txt | sha256sum --check
          tar --extract --gzip --file "${archive}" gitleaks

      - name: Scan files and Git history
        run: ./gitleaks git --redact --verbose .

  dependencies:
    name: Locked dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.32
          enable-cache: true

      - name: Restore locked audit tooling
        run: uv sync --frozen --extra dev

      - name: Export hashed runtime dependency set
        run: >
          uv export --frozen --no-dev --no-emit-project
          --format requirements-txt
          --output-file /tmp/runtime-requirements.txt

      - name: Fail on known dependency vulnerabilities
        run: >
          uv run pip-audit
          --strict
          --require-hashes
          --requirement /tmp/runtime-requirements.txt
