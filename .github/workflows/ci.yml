name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: 0.11.32

jobs:
  verify:
    name: Static analysis, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Restore locked environment
        run: uv sync --frozen --extra dev

      - name: Run static analysis
        run: |
          uv run ruff check src tests alembic dev_support scripts
          uv run mypy src tests dev_support scripts

      - name: Run unit tests with coverage gate
        run: >
          uv run pytest -m "not integration"
          --cov=retailflow_orders
          --cov-report=term-missing
          --cov-report=xml
          -q

      - name: Validate migration SQL
        run: uv run alembic upgrade head --sql > /tmp/retailflow-orders-upgrade.sql

      - name: Build wheel and source distribution
        run: uv build

  integration:
    name: PostgreSQL, Redis, and Kafka integration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Restore locked environment
        run: uv sync --frozen --extra dev

      - name: Run container-backed integration tests
        run: uv run pytest -m integration -q

  container-smoke:
    name: Container smoke test
    needs: [verify, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure documented local environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        run: docker compose up --build --detach

      - name: Exercise the critical workflow
        run: ./scripts/smoke-test.sh

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
